<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学学习 - 小剀学苑</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header {
            text-align: center;
            color: #333;
            padding: 30px 20px;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.1);
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
        }
        .modules {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .module-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .module-card:hover { transform: translateY(-5px); }
        .module-icon { font-size: 3em; margin-bottom: 10px; }
        .module-name { font-size: 1.3em; color: #333; margin-bottom: 10px; }
        .module-desc { color: #666; font-size: 0.9em; }
        .days-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .days-title { font-size: 1.3em; margin-bottom: 15px; text-align: center; }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        .day-card {
            background: #fffaf0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .day-card:hover { border-color: #fcb69f; }
        .day-card.new {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← 返回首页</a>
    <div class="container">
        <header>
            <h1>🔢 数学学习</h1>
            <p>简便运算 · 逻辑思维 · 计算练习</p>
        </header>

        <div class="modules">
            <div class="module-card">
                <div class="module-icon">🧮</div>
                <div class="module-name">简便运算</div>
                <div class="module-desc">20道初一水平计算题</div>
            </div>
            <div class="module-card">
                <div class="module-icon">📊</div>
                <div class="module-name">学习进度</div>
                <div class="module-desc" id="progress">点击下方日期开始学习</div>
            </div>
        </div>

        <div class="days-section">
            <h2 class="days-title">📅 选择学习日期</h2>
            <div class="days-grid">
                <div class="day-card new" onclick="location.href='days/2026-08-09.html'">
                    <div>🌟 2026-08-09</div>
                    <small>新内容</small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
